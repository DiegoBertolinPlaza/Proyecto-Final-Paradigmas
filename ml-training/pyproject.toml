[project]
name = "mdh-ml-training"
version = "0.1.0"
description = "Entorno de entrenamiento del jefe (ML-Agents) de Matrícula de Honor"
# com.unity.ml-agents 4.2.0 es compatible con mlagents 1.1.0 y Python 3.10.1–3.10.12
# (tabla de compatibilidad de Documentation~/Installation.md del paquete).
requires-python = ">=3.10.1,<3.11"
dependencies = [
    "mlagents==1.1.0",
    # Misma tabla: PyTorch 2.1.1–2.8.0. Sin este tope uv elige la última y mlagents no la soporta.
    "torch>=2.1.1,<=2.8.0",
    # mlagents 1.1.0 importa pkg_resources, que las versiones nuevas de setuptools ya no traen.
    "setuptools>=65,<80",
]

[tool.uv]
# No es un paquete instalable: solo fija las dependencias del entrenamiento.
package = false
