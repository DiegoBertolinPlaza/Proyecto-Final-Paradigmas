# Entrenamiento "de verdad" del jefe El Tribunal (PPO). Es el .yaml que pide la Entrega 2.
#
# Comportamiento: BossAgent.BehaviorName = "TribunalBoss"
#   Observaciones: 14 floats (BossObservation.Size)
#   Acciones: 2 continuas (moverse) + 1 rama discreta de 3 (nada / lanzar / embestir)
#
# Uso (desde ml-training):
#   .\train.ps1 config\tribunal_boss.yaml --env=<ruta>\BossTraining.exe --run-id=tribunal-01 --no-graphics

behaviors:
  TribunalBoss:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # Guardamos varios checkpoints: los intermedios sirven como niveles de dificultad.
    keep_checkpoints: 10
    checkpoint_interval: 200000
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 20000

engine_settings:
  time_scale: 20
  no_graphics: true
