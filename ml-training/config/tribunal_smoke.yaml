# Entrenamiento de humo (P0.6–7): unos minutos, solo para comprobar que la tubería funciona
# de punta a punta (Unity -> Python -> .onnx -> Unity). El jefe NO aprende nada útil con esto.
#
# Uso (desde ml-training):
#   .\train.ps1 config\tribunal_smoke.yaml --env=<ruta>\BossTraining.exe --run-id=smoke --no-graphics

behaviors:
  TribunalBoss:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 64
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 2
    checkpoint_interval: 25000
    max_steps: 50000
    time_horizon: 64
    summary_freq: 5000

engine_settings:
  time_scale: 20
  no_graphics: true
